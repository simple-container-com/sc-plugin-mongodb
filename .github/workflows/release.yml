name: Release

# Cuts cross-platform binaries + sha256sums for every release. Two triggers:
#
#   - push to main → auto-release with CalVer "vYYYY.MM.DD-<short-sha>".
#     Mirrors simple-container-com/api's own release cadence (every merge
#     to main cuts a new sc release).
#   - manually-pushed "v*" tag → named release for pinning / rollback.
#
# Both paths produce the same artifact set: three binaries (linux/amd64,
# linux/arm64, darwin/arm64), a sha256sums.txt, and a GitHub Release.
# darwin/amd64 and windows are intentionally unsupported — the operator
# surface is Linux CI runners + Apple-Silicon dev laptops.
#
# Why the OOM pins (GOMAXPROCS=1, GOMEMLIMIT=6GiB, `go build -p 1`): a
# plugin that imports a big cloud SDK (pulumi-yandex is ~2 GB of
# generated provider types, pulumi-sbercloud similar) OOMs the standard
# 7 GB GHA runner at default parallelism. These pins cost ~2 minutes of
# wall time on linux/amd64 and prevent a class of first-release failure
# that is nearly invisible from the author's local box. Keep them even
# for a plugin whose cloud SDK is small today — four of six existing SC
# plugin repos learned this lesson the hard way (first commit of
# sc-plugin-yandex release workflow, 2026-10-25).

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_tag:  ${{ steps.compute.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        name: Resolve version string
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true"               >> "$GITHUB_OUTPUT"
          else
            # CalVer with short SHA — same shape SC core uses.
            ver="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
            echo "version=${ver}"            >> "$GITHUB_OUTPUT"
            echo "is_tag=false"              >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugin/go.sum

      - name: Build
        working-directory: plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.version.outputs.version }}
          # See file-level comment: these two prevent the default-parallelism
          # OOM on 7 GB GHA runners that most SC cloud plugins hit on their
          # first release run.
          GOMAXPROCS: '1'
          GOMEMLIMIT: '6GiB'
        run: |
          out=sc-plugin-mongodb-${GOOS}-${GOARCH}
          go build -trimpath -buildvcs=false -p 1 \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o "../${out}" \
            ./cmd/sc-plugin-mongodb
          sha256sum "../${out}" > "../${out}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sc-plugin-mongodb-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build consolidated sha256sums.txt
        working-directory: dist
        run: |
          cat sc-plugin-mongodb-*.sha256 > sha256sums.txt
          rm sc-plugin-mongodb-*.sha256
          cat sha256sums.txt

      - name: Tag commit if from main
        if: needs.version.outputs.is_tag == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes \
            dist/*
